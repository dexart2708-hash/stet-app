<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
  <title>Чек-лист Управляющего Отелем</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.png" type="image/png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

  <style>
    :root {
      --primary: #1e293b;       /* Мягкий тёмно-синий */
      --primary-light: #334155;
      --primary-dark: #0f172a;
      --accent: #f59e0b;        /* Тёплый янтарный */
      --accent-hover: #d97706;
      --sidebar-bg: #f8fafc;
      --sidebar-hover: #eef2f6;
      --sidebar-active: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-light: #94a3b8;
      --bg-main: #ffffff;
      --bg-panel: #f1f5f9;
      --border: #e2e8f0;
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --header-bg: var(--primary);
      --header-text: #ffffff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }
    [data-theme="forest"] { --primary: #1e6b3b; --primary-light: #2a8a4e; --primary-dark: #124d2a; --accent: #e48c00; --accent-hover: #c97a00; --header-bg: #1e6b3b; }
    [data-theme="sunset"] { --primary: #b85a2a; --primary-light: #d4703a; --primary-dark: #8f451f; --accent: #e48c00; --accent-hover: #c97a00; --header-bg: #b85a2a; }
    [data-theme="navy"] { --primary: #1a2a4a; --primary-light: #2a406a; --primary-dark: #0e1a30; --accent: #e48c00; --accent-hover: #c97a00; --header-bg: #1a2a4a; }
    [data-theme="rose"] { --primary: #9e2b5e; --primary-light: #c03a76; --primary-dark: #731f44; --accent: #e48c00; --accent-hover: #c97a00; --header-bg: #9e2b5e; }
    [data-theme="slate"] { --primary: #475569; --primary-light: #64748b; --primary-dark: #334155; --accent: #e48c00; --accent-hover: #c97a00; --header-bg: #475569; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg-panel);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; background: var(--header-bg); color: var(--header-text);
      border-bottom: 3px solid var(--accent); flex-shrink: 0; z-index: 10; flex-wrap: wrap; gap: 8px;
    }
    .app-header .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.15rem; color: #fff; white-space: nowrap; }
    .app-header .logo img { height: 40px; width: auto; border-radius: 4px; object-fit: contain; flex-shrink: 0; }
    .header-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; justify-content: flex-end; }
    
    .search-wrap { position: relative; display: flex; align-items: center; flex: 1 1 160px; min-width: 120px; }
    .search-wrap i { position: absolute; left: 10px; color: rgba(255,255,255,0.6); font-size: 0.8rem; }
    .search-wrap input { padding: 6px 10px 6px 32px; border: 1px solid rgba(255,255,255,0.2); border-radius: 50px; background: rgba(255,255,255,0.12); font-size: 0.85rem; width: 100%; outline: none; color: #fff; min-height: 32px; }
    .search-wrap input:focus { border-color: var(--accent); background: rgba(255,255,255,0.2); }
    .search-clear { position: absolute; right: 8px; background: none; border: none; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 0.9rem; display: none; }
    .search-clear.visible { display: block; }

    .theme-picker { display: flex; align-items: center; gap: 3px; }
    .theme-picker label { font-size: 0.7rem; color: rgba(255,255,255,0.7); margin-right: 4px; }
    .theme-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: var(--transition); flex-shrink: 0; }
    .theme-btn.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--header-bg), 0 0 0 4px var(--accent); }
    .theme-btn[data-theme="default"] { background: #0e1335; }
    .theme-btn[data-theme="forest"] { background: #1e6b3b; }
    .theme-btn[data-theme="sunset"] { background: #b85a2a; }
    .theme-btn[data-theme="navy"] { background: #1a2a4a; }
    .theme-btn[data-theme="rose"] { background: #9e2b5e; }
    .theme-btn[data-theme="slate"] { background: #475569; }

    .sync-indicator { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.1); padding: 3px 10px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.15); }
    .sync-indicator .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: #6b7280; }
    .sync-indicator .dot.syncing { animation: pulse 1s infinite; background: #f59e0b; }
    .sync-indicator .dot.online { background: #10b981; }
    .sync-indicator .dot.offline { background: #ef4444; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .admin-status { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: rgba(255,255,255,0.7); }
    .admin-status .status-badge { padding: 2px 8px; border-radius: 50px; font-weight: 600; font-size: 0.6rem; }
    .admin-status .status-badge.viewer { background: rgba(255,255,255,0.15); color: #fff; }
    .admin-status .status-badge.admin { background: var(--accent); color: #fff; }
    .admin-status button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 2px 12px; border-radius: 50px; cursor: pointer; font-size: 0.7rem; color: #fff; }
    .admin-status button.admin-btn { background: var(--accent); border-color: var(--accent); }

    /* ===== КНОПКИ ДЛЯ АДМИНА (Экспорт/Импорт/Сброс) ===== */
    .admin-data-actions { display: none; align-items: center; gap: 6px; }
    .admin-data-actions.visible { display: flex; }
    .admin-data-actions button {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      padding: 3px 10px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #fff;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      min-height: 26px;
    }
    .admin-data-actions button:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .admin-data-actions button.export-btn { background: var(--accent); border-color: var(--accent); color: #fff; }
    .admin-data-actions button.export-btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .admin-data-actions button.reset-btn:hover { background: #e74c3c; border-color: #e74c3c; }
    #importFileInput { display: none; }

    .app-body { display: flex; flex: 1; overflow: hidden; }

    .sidebar { width: 300px; min-width: 300px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-header { padding: 12px 16px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg-main); }
    .sidebar-header h3 { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; }
    .sidebar-header .actions { display: flex; gap: 4px; }
    .sidebar-header .actions button { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.9rem; padding: 4px 6px; border-radius: var(--radius-sm); }
    .sidebar-header .actions button.primary-add { background: var(--accent); color: #fff; padding: 4px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .sidebar-header .actions button.primary-add.hidden { display: none; }

    .sidebar-tree { flex: 1; overflow-y: auto; padding: 8px 10px 20px; }
    .tree-node { margin-bottom: 1px; user-select: none; position: relative; }
    .tree-node .node-label { display: flex; align-items: center; padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); gap: 6px; position: relative; font-size: 0.85rem; }
    .tree-node .node-label:hover { background: var(--sidebar-hover); }
    .tree-node .node-label.active { background: var(--sidebar-active); font-weight: 600; color: var(--primary); border-left: 3px solid var(--accent); }
    .tree-node .node-label .icon { width: 20px; text-align: center; color: var(--text-light); flex-shrink: 0; }
    .tree-node .node-label .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-node .node-label .toggle { margin-left: auto; color: var(--text-light); font-size: 0.65rem; transition: var(--transition); }
    .tree-node .node-label .toggle.open { transform: rotate(90deg); }
    
    .tree-node .node-actions { display: flex; align-items: center; gap: 4px; margin-left: 4px; flex-shrink: 0; background: var(--sidebar-bg); padding-left: 4px; }
    .tree-node .node-actions button { background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 0.8rem; padding: 2px 4px; border-radius: 4px; transition: var(--transition); }
    .tree-node .node-actions button:hover { background: rgba(0,0,0,0.05); color: var(--primary); }
    .tree-node .node-actions button.danger:hover { color: #e74c3c; background: rgba(231, 76, 60, 0.10); }

    .tree-node .children { padding-left: 18px; overflow: hidden; max-height: 0; transition: max-height 0.35s ease, opacity 0.25s ease; opacity: 0; }
    .tree-node .children.open { max-height: 2000px; opacity: 1; }
    .empty-tree { padding: 20px 16px; text-align: center; color: var(--text-light); font-size: 0.85rem; }

    .node-label.dragging { opacity: 0.4; }
    .node-label.drop-target { background-color: var(--accent); color: #fff; border-radius: var(--radius-sm); }
    .node-label.drop-target .icon, .node-label.drop-target .title, .node-label.drop-target .toggle { color: #fff; }

    .content-panel { flex: 1; overflow-y: auto; padding: 16px 20px 30px; background: var(--bg-main); display: flex; flex-direction: column; }
    .content-panel .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-light); text-align: center; }
    .content-panel .empty-state i { font-size: 3rem; margin-bottom: 16px; opacity: 0.3; }

    .section-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid var(--border); flex-wrap: wrap; gap: 8px; }
    .section-header .title-group { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 150px; }
    .section-header .title-group h2 { font-size: 1.3rem; font-weight: 700; color: var(--text-primary); word-break: break-word; }
    .section-header .title-group .type-badge { font-size: 0.6rem; text-transform: uppercase; background: var(--primary); color: #fff; padding: 2px 10px; border-radius: 50px; font-weight: 600; flex-shrink: 0; }
    .section-header .content-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .section-header .content-actions button { background: none; border: 1px solid var(--border); padding: 5px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.75rem; color: var(--text-secondary); transition: var(--transition); display: flex; align-items: center; gap: 5px; font-weight: 500; }
    .section-header .content-actions button:hover { background: var(--sidebar-hover); border-color: var(--primary); color: var(--primary); }
    .section-header .content-actions button.primary-btn { background: var(--accent); border-color: var(--accent); color: #fff; }
    .section-header .content-actions button.primary-btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
    .section-header .content-actions button.danger-btn { border-color: #e74c3c; color: #e74c3c; }
    .section-header .content-actions button.danger-btn:hover { border-color: #e74c3c; color: #e74c3c; background: rgba(231, 76, 60, 0.06); }
    .section-header .content-actions button.success-btn { background: #10b981; border-color: #10b981; color: #fff; }

    .content-render img, .ql-editor img {
      max-width: 100% !important;
      height: auto !important;
      border-radius: var(--radius-sm);
      margin: 10px 0;
      display: block;
      max-height: 400px;
      width: auto;
    }

    .content-render { font-size: 0.9rem; line-height: 1.6; color: var(--text-primary); }
    .content-render h3 { font-size: 1.05rem; font-weight: 600; margin: 1.2rem 0 0.5rem; }
    .content-render p { margin: 0 0 0.6rem; }
    .content-render ul { padding-left: 20px; margin: 0 0 0.6rem; }
    .content-render table { width: 100%; border-collapse: collapse; margin: 0.8rem 0; font-size: 0.8rem; }
    .content-render table th, .content-render table td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    .content-render table th { background: var(--sidebar-bg); font-weight: 600; }
    
    /* ===== ПРОГРЕСС-БАР ===== */
    .progress-wrap { margin-bottom: 16px; padding-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
    .progress-text { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); letter-spacing: 0.3px; }
    .progress-bar { width: 100%; height: 5px; background: var(--border); border-radius: 10px; overflow: hidden; }
    .progress-track { width: 100%; height: 8px; background: var(--bg-panel); border-radius: 50px; overflow: hidden; }
    .progress-fill { height: 100%; background: #10b981; border-radius: 50px; transition: width 0.3s ease; }

    .checklist { display: flex; flex-direction: column; gap: 6px; margin-bottom: 1rem; }
    .checklist-item { display: flex; align-items: stretch; border-radius: var(--radius-sm); transition: var(--transition); border: 1px solid var(--border); overflow: hidden; background: var(--bg-main); box-shadow: var(--shadow); }
    .checklist-item:hover { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05); }
    .checklist-item .time { flex: 0 0 80px; font-weight: 600; color: #fff; background: var(--primary); padding: 10px 10px; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; }
    .checklist-item .task { flex: 1; padding: 10px 14px; display: flex; align-items: center; background: var(--bg-main); font-size: 0.85rem; line-height: 1.4; }
    .checklist-item .task .checkbox { margin-right: 12px; flex-shrink: 0; width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 4px; cursor: pointer; background: #fff; display: flex; align-items: center; justify-content: center; }
    .checklist-item .task .checkbox.checked { background: #10b981; border-color: #10b981; }
    .checklist-item .task .checkbox.checked::after { content: "✓"; color: #fff; font-size: 0.8rem; }

    .edit-checklist { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .edit-row { display: flex; align-items: center; gap: 6px; background: var(--bg-panel); padding: 6px; border-radius: var(--radius-sm); border: 1px solid transparent; transition: margin-top 0.2s ease, opacity 0.2s ease, border-color 0.2s; touch-action: none; }
    .edit-row.drag-over { border-color: var(--accent); background: var(--sidebar-active); transform: scale(1.01); }
    .edit-row.dragging { opacity: 0.5; background: #e0e7ff; }
    .edit-row input[type="text"] { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; font-family: var(--font); background: #fff; min-width: 0; outline: none; }
    .edit-row input.time-input { flex: 0 0 70px; text-align: center; }
    .edit-row .drag-handle { cursor: grab; color: var(--text-light); padding: 4px 2px; touch-action: none; }
    .edit-row .edit-actions { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
    .edit-row .edit-actions button { background: #fff; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; padding: 2px 6px; font-size: 0.65rem; color: var(--text-secondary); transition: 0.15s; min-width: 24px; min-height: 24px; }
    .edit-row .remove-btn { background: none; border: none; color: #e74c3c; font-size: 0.9rem; cursor: pointer; padding: 8px; flex-shrink: 0; min-width: 40px; min-height: 40px; display: flex; align-items: center; justify-content: center; }
    .edit-toolbar { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
    .edit-toolbar button { min-height: 40px; padding: 0 14px; }

    @media (max-width: 768px) {
      .sidebar { width: 240px; min-width: 240px; }
      .content-panel { padding: 12px 14px 20px; }
      .checklist-item .time { flex: 0 0 60px; font-size: 0.7rem; }
    }
    @media (max-width: 600px) {
      .app-body { flex-direction: column; }
      .sidebar { width: 100%; min-width: unset; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
      .content-panel { flex: 1; overflow-y: auto; padding: 10px 12px 20px; }
      .section-header .title-group h2 { font-size: 1.1rem; }
    }

    @media print {
      .app-header, .sidebar, .section-header .content-actions, .edit-toolbar, #sidebar, .sync-indicator, .admin-status { display: none !important; }
      .app-body { display: block !important; overflow: visible !important; }
      body { background: #fff !important; height: auto !important; overflow: visible !important; }
      .content-panel { padding: 20px; height: auto !important; overflow: visible !important; }
      .checklist-item { page-break-inside: avoid; border: 1px solid #e2e8f0 !important; box-shadow: none !important; }
      .time { background: #0e1335 !important; color: #fff !important; }
      .section-header { border-bottom: 2px solid #0e1335 !important; padding-bottom: 10px !important; margin-bottom: 16px !important; }
      .progress-wrap { display: flex !important; margin-bottom: 12px !important; }
      .checkbox.checked { background: #10b981 !important; border-color: #10b981 !important; }
      .modal-overlay { display: none !important; }
    }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 10px; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--bg-main); border-radius: var(--radius); max-width: 780px; width: 100%; max-height: 95vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; border-top: 4px solid var(--accent); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg-panel); }
    .modal-header h3 { font-size: 1rem; font-weight: 600; color: var(--primary); }
    .modal-header button.close { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-light); transition: var(--transition); padding: 0 6px; }
    .modal-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
    .modal-body .field { margin-bottom: 14px; }
    .modal-body .field label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 4px; color: var(--text-secondary); }
    .modal-body .field input[type="text"], .modal-body .field select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; font-family: var(--font); background: var(--bg-main); color: var(--text-primary); outline: none; }
    .modal-body .field input:focus, .modal-body .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(235, 139, 15, 0.15); }
    
    #editor-field { display: none; margin-top: 10px; width: 100%; }
    #editor-container { height: 350px !important; min-height: 350px !important; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); width: 100% !important; }
    .ql-editor { font-family: var(--font); font-size: 0.9rem; }
    .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; background: var(--bg-panel); }
    .modal-footer button { padding: 6px 20px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-size: 0.85rem; font-weight: 500; min-height: 36px; }
    .modal-footer button.cancel { background: var(--sidebar-bg); color: var(--text-secondary); }
    .modal-footer button.cancel:hover { background: var(--sidebar-hover); }
    .modal-footer button.save { background: var(--accent); color: #fff; }
    .modal-footer button.save:hover { background: var(--accent-hover); }
    
    /* ===== СТИЛИ ДЛЯ НОВЫХ ИНСТРУМЕНТОВ QUIL ===== */
    /* Выпадающий список шрифтов в редакторе */
    .ql-snow .ql-picker.ql-font .ql-picker-label::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item::before {
      content: attr(data-label);
    }
    .ql-font-inter { font-family: 'Inter', sans-serif; }
    .ql-font-arial { font-family: 'Arial', sans-serif; }
    .ql-font-georgia { font-family: 'Georgia', serif; }
    .ql-font-times-new-roman { font-family: 'Times New Roman', serif; }
    .ql-snow .ql-picker.ql-size .ql-picker-label::before,

      <!-- ===== КНОПКИ ДЛЯ АДМИНА ===== -->

  <div class="app-body">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">

        <div class="actions">
          <button id="expandAllBtn" title="Развернуть всё"><i class="fas fa-expand"></i></button>
          <button id="collapseAllBtn" title="Свернуть всё"><i class="fas fa-compress"></i></button>
          <button class="primary-add" id="addSectionBtn"><i class="fas fa-plus"></i> Добавить</button>
        </div>
      </div>
      <div class="sidebar-tree" id="treeContainer"></div>

    <main class="content-panel" id="contentPanel"></main>

  <!-- ===== МОДАЛЬНОЕ ОКНО ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Редактировать раздел</h3>

      </div>

        <div class="field">
          <label>Название раздела</label>
          <input type="text" id="editTitle" />
        </div>
        <div class="field">
          <label>Тип раздела</label>
          <select id="editType">
            <option value="text">Текст / Инструкция (с таблицами и фото)</option>
            <option value="checklist">Чек-лист (список задач)</option>
          </select>
        </div>

          <label>Содержимое</label>
          <div id="editor-container"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="cancel" id="modalCancel">Отмена</button>
        <button class="save" id="modalSave">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // 1. FIREBASE
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDdm0kaIesCu4CBennxPVoPhXwyAyAiwIg",
      authDomain: "chek-listdb.firebaseapp.com",
      projectId: "chek-listdb",
      storageBucket: "chek-listdb.firebasestorage.app",
      messagingSenderId: "966580226421",
      appId: "1:966580226421:web:af59fd2a1ad92fd4b8eb3c",
      measurementId: "G-L3ZGHEEKQ5"
    };

    let db = null;
    let firebaseAvailable = false;
    const DATA_DOC = 'checklists';
    const DATA_ID = 'main';
    
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      
      db.collection(DATA_DOC).doc(DATA_ID).get()
        .then(() => {
          firebaseAvailable = true;
          updateSyncStatus('online', 'Синхронизировано');
          initData();
        })
        .catch(err => {
          console.warn('Firebase недоступен:', err);
          firebaseAvailable = false;
          updateSyncStatus('offline', 'Офлайн');
          initData();
        });
    } catch (e) {
      console.warn('Firebase не инициализирован:', e);
      firebaseAvailable = false;
      updateSyncStatus('offline', 'Firebase не подключён');
      initData();
    }

    let data = null, selectedId = null, searchQuery = '', nextId = 100, isAdmin = false, editingId = null;
    const ADMIN_PASSWORD = 'admin123';
    const expanded = new Map();
    const INITIAL_DATA = {
      sections: [{ id: 's1', title: 'Общая инструкция', type: 'text', content: '<h3>Добро пожаловать!</h3><p>Здесь вы можете создавать инструкции и чек-листы.</p>' }]
    };

    function generateId() { return 'n' + (nextId++); }
    function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }
    function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

    function findNode(tree, id) {
      for (const node of tree) {
        if (node.id === id) return node;
        if (node.children) { const found = findNode(node.children, id); if (found) return found; }
      }
      return null;
    }
    function getParent(tree, id) {
      for (const node of tree) {
        if (node.children) {
          if (node.children.some(c => c.id === id)) return node;
          const found = getParent(node.children, id); if (found) return found;
        }
      }
      return null;
    }
    function isAncestor(node, targetId) {
      if (!node.children || node.children.length === 0) return false;
      for (const child of node.children) {
        if (child.id === targetId) return true;
        if (isAncestor(child, targetId)) return true;
      }
      return false;
    }

    function updateSyncStatus(status, text) {
      const dot = document.getElementById('syncDot'), txt = document.getElementById('syncText');
      if (!dot || !txt) return;
      dot.className = 'dot';
      if (status === 'syncing') { dot.classList.add('syncing'); txt.textContent = 'Синхронизация...'; }
      else if (status === 'online') { dot.classList.add('online'); txt.textContent = 'Синхронизировано'; }
      else { dot.classList.add('offline'); txt.textContent = 'Офлайн (локально)'; }
    }

    async function pushToFirebase() {
      if (!db || !data) return;
      try {
        updateSyncStatus('syncing', 'Отправка...');
        await db.collection(DATA_DOC).doc(DATA_ID).set(data, { merge: true });
        firebaseAvailable = true; 
        updateSyncStatus('online', 'Синхронизировано');
      } catch (err) {
        firebaseAvailable = false;
        updateSyncStatus('offline', 'Офлайн');
      }
    }

    async function pullFromFirebase() {
      if (!db) return false;
      try {
        const docSnap = await db.collection(DATA_DOC).doc(DATA_ID).get();
        firebaseAvailable = true;
        if (docSnap.exists) {
          const cloudData = docSnap.data();
          if (cloudData && cloudData.sections && cloudData.sections.length > 0) {
            data = cloudData; localStorage.setItem('hotelChecklistData', JSON.stringify(data));
            updateSyncStatus('online', 'Синхронизировано');
            return true;
          } else {
            console.log('⚠️ Firebase вернул пустой массив. Оставляем локальные данные.');
          }
        }
        return false;
      } catch (err) {
        console.warn('Firebase pull error:', err);
        firebaseAvailable = false;
        updateSyncStatus('offline', 'Офлайн');
        return false;
      }
    }

    // ============================================================
    // 2. РАБОТА С ЛОКАЛЬНЫМ ХРАНИЛИЩЕМ
    // ============================================================
    function loadFromLocalStorage() {
      const stored = localStorage.getItem('hotelChecklistData');
      if (stored) {
        try { return JSON.parse(stored); } catch (e) {}
      }
      return null;
    }

    function saveToLocalStorage(dataObj) {
      localStorage.setItem('hotelChecklistData', JSON.stringify(dataObj));
    }

    function saveData() {
      if (!data) return;
      saveToLocalStorage(data);
      if (navigator.onLine && db) pushToFirebase();
    }

    // ============================================================
    // 3. ИНИЦИАЛИЗАЦИЯ И РЕНДЕРИНГ ДЕРЕВА
    // ============================================================
    function renderTree() {
      const container = document.getElementById('treeContainer');
      if (!container) return;
      const query = searchQuery.trim().toLowerCase();
      const filtered = query ? filterTree(data.sections, query) : data.sections;

      if (!filtered || filtered.length === 0) {
        container.innerHTML = `<div class="empty-tree"><i class="fas fa-list"></i><p>Нет разделов.</p></div>`;
        return;
      }
      let html = '';
      for (const node of filtered) html += renderNode(node);
      container.innerHTML = html;
      
      container.querySelectorAll('.node-label').forEach(el => {
        el.addEventListener('click', function(e) {
          const id = this.dataset.id;
          if (e.target.closest('.toggle')) {
            const node = findNode(data.sections, id);
            if (node && node.children) {
              const current = expanded.get(id);
              if (current === true) expanded.set(id, false);
              else expanded.set(id, true);
              renderTree();
            }
            return;
          }
          if (e.target.closest('.node-actions')) return;
          selectNode(id);
        });
      });

      container.querySelectorAll('.edit-node-btn').forEach(el => {
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          if (!isAdmin) { alert('Нет прав'); return; }
          openEditModal(this.dataset.id);
        });
      });
      container.querySelectorAll('.delete-node-btn').forEach(el => {
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          if (!isAdmin) { alert('Нет прав'); return; }
          if (confirm('Удалить этот раздел?')) deleteSection(this.dataset.id);
        });
      });

      if (isAdmin) {
        bindTreeDragDropEvents(container);
      }
    }

    function filterTree(tree, query) {
      const result = [];
      for (const node of tree) {
        if (nodeMatches(node, query)) {
          const clone = { ...node };
          if (clone.children) clone.children = filterTree(clone.children, query);
          result.push(clone);
        }
      }
      return result;
    }
    function nodeMatches(node, query) {
      if (!query) return true;
      if (node.title.toLowerCase().includes(query)) return true;
      if (node.content && node.content.toLowerCase().includes(query)) return true;
      if (node.children) for (const child of node.children) if (nodeMatches(child, query)) return true;
      return false;
    }

    function renderNode(node) {
      const isGroup = node.children && node.children.length > 0;
      const isActive = node.id === selectedId;
      
      let isExpanded = false;
      if (expanded.has(node.id)) {
        isExpanded = expanded.get(node.id);
      } else {
        isExpanded = (isActive && isGroup) || (selectedId && isAncestor(node, selectedId));
      }
      
      const icon = isGroup ? (isExpanded ? 'fa-folder-open' : 'fa-folder') : (node.type === 'checklist' ? 'fa-check-square' : 'fa-file-alt');
      
      let html = `<div class="tree-node" data-id="${node.id}"><div class="node-label ${isActive ? 'active' : ''}" data-id="${node.id}">`;
      html += `<span class="icon"><i class="fas ${icon}"></i></span><span class="title">${escapeHtml(node.title)}</span>`;
      
      if (isGroup) html += `<span class="toggle ${isExpanded ? 'open' : ''}"><i class="fas fa-chevron-right"></i></span>`;
      
      if (isAdmin) {
        html += `<span class="node-actions">`;
        html += `<button class="edit-node-btn" data-id="${node.id}"><i class="fas fa-pen"></i></button>`;
        html += `<button class="delete-node-btn" data-id="${node.id}"><i class="fas fa-trash"></i></button>`;
        html += `</span>`;
      }
      html += `</div>`;
      if (isGroup && isExpanded) {
        html += `<div class="children open">`;
        for (const child of node.children) html += renderNode(child);
        html += `</div>`;
      }
      html += `</div>`;
      return html;
    }

    function selectNode(id) {
      selectedId = id; renderTree();
      if (editingId === id && !isAdmin) editingId = null; 
      renderContent(id); saveData();
    }

    // ============================================================
    // 4. DRAG & DROP ДЕРЕВА
    // ============================================================
    function bindTreeDragDropEvents(container) {
        let draggedId = null;
        container.querySelectorAll('.node-label').forEach(el => {
            el.setAttribute('draggable', 'true');
            el.addEventListener('dragstart', function(e) {
                draggedId = this.dataset.id;
                e.dataTransfer.setData('text/plain', this.dataset.id);
                e.dataTransfer.effectAllowed = 'move';
                setTimeout(() => this.classList.add('dragging'), 0);
            });
            el.addEventListener('dragend', function(e) {
                this.classList.remove('dragging');
                document.querySelectorAll('.node-label.drop-target').forEach(el => el.classList.remove('drop-target'));
                draggedId = null;
            });
        });

        container.querySelectorAll('.node-label').forEach(el => {
            el.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                document.querySelectorAll('.node-label.drop-target').forEach(label => label.classList.remove('drop-target'));
                this.classList.add('drop-target');
            });
            
            el.addEventListener('dragleave', function(e) {
                if (e.target.closest('.node-label') !== this) return;
                this.classList.remove('drop-target');
            });

            el.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('drop-target');
                if (!draggedId || draggedId === this.dataset.id) return;

                const draggedNode = findNode(data.sections, draggedId);
                const targetNode = findNode(data.sections, this.dataset.id);
                if (!draggedNode || !targetNode) return;

                const parent = getParent(data.sections, draggedId);
                if (parent) {
                    parent.children = parent.children.filter(c => c.id !== draggedId);
                } else {
                    data.sections = data.sections.filter(s => s.id !== draggedId);
                }

                if (targetNode.children) {
                    targetNode.children.push(draggedNode);
                } else {
                    const targetParent = getParent(data.sections, this.dataset.id);
                    if (targetParent) {
                        const targetIdx = targetParent.children.findIndex(c => c.id === this.dataset.id);
                        targetParent.children.splice(targetIdx + 1, 0, draggedNode);
                    } else {
                        const targetIdx = data.sections.findIndex(s => s.id === this.dataset.id);
                        data.sections.splice(targetIdx + 1, 0, draggedNode);
                    }
                }

                saveData();
                renderTree();
                if (selectedId) renderContent(selectedId);
            });
        });
    }

    // ============================================================
    // 5. РЕНДЕРИНГ КОНТЕНТА (ЧЕКБОКСЫ И ЦВЕТНОЙ ПРОГРЕСС-БАР)
    // ============================================================
    function renderContent(id) {
      const panel = document.getElementById('contentPanel');
      if (!panel) return;
      const node = findNode(data.sections, id);
      if (!node) { panel.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i><h2>Выберите раздел</h2></div>`; return; }

      if (!isAdmin && editingId === node.id) editingId = null;

      let html = `<div class="section-header"><div class="title-group"><h2>${escapeHtml(node.title)}</h2>`;
      html += `<span class="type-badge">${node.type === 'checklist' ? 'Чек-лист' : 'Текст'}</span>`;
      html += `</div><div class="content-actions">`;
      
      if (node.type === 'checklist') {
        if (editingId === node.id) {
          html += `<button class="success-btn" id="saveEditsBtn"><i class="fas fa-check"></i> Сохранить</button>`;
          html += `<button class="danger-btn" id="cancelEditsBtn"><i class="fas fa-times"></i> Отмена</button>`;
        } else {
          if (isAdmin) html += `<button class="primary-btn" id="editSectionBtn"><i class="fas fa-pen"></i> Редактировать</button>`;
        }
        html += `<button class="download-btn" id="printChecklistBtn"><i class="fas fa-file-pdf"></i> Экспорт / Печать (PDF)</button>`;
      } else {
        if (isAdmin) html += `<button class="primary-btn" id="openModalEditBtn"><i class="fas fa-pen"></i> Редактировать раздел</button>`;
      }
      html += `</div></div><div class="content-render">`;

      if (node.type === 'checklist') {
        if (editingId === node.id) {
          html += renderEditableChecklist(node);
        } else {
          const items = node.items || [];
            const total = items.length;
            // Подсчитываем выполненные задачи
            const done = items.filter(i => i.checked).length;
            const percent = total > 0 ? (done / total) * 100 : 0;

            // Прогресс-бар
            html += `<div class="progress-wrapper">
                <div class="progress-text">${done} из ${total} выполнено (${Math.round(percent)}%)</div>
                <div class="progress-track">
                    <div class="progress-fill" style="width: ${percent}%;"></div>
                </div>
            </div>`;

            html += `<div class="checklist">`;
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                html += `<div class="checklist-item">`;
                html += `<div class="time">${escapeHtml(item.time)}</div>`;
                html += `<div class="task">`;
                // Сохранили ваш data-index и логику checked
                html += `<span class="checkbox ${item.checked ? 'checked' : ''}" data-index="${i}"></span>`;
                html += `<span class="text">${escapeHtml(item.task)}</span>`;
                html += `</div>`;
                html += `</div>`;
            }
          html += `</div>`;
        }
      } else if (node.type === 'text') { 
        html += node.content || '<p style="color:var(--text-light);font-style:italic;">Нажмите "Редактировать раздел", чтобы заполнить инструкцию.</p>'; 
      }
      html += `</div>`;
      panel.innerHTML = html;

      panel.querySelectorAll('.checkbox').forEach(el => {
        el.addEventListener('click', function() {
          const idx = parseInt(this.dataset.index);
          const node = findNode(data.sections, id);
          if (node && node.items && node.items[idx]) {
            node.items[idx].checked = !node.items[idx].checked;
            saveData();
            renderContent(id);
          }
        });
      });
      
      const printBtn = document.getElementById('printChecklistBtn');
      if (printBtn) printBtn.addEventListener('click', function() { window.print(); });

      const editBtn = document.getElementById('editSectionBtn');
      if (editBtn) editBtn.addEventListener('click', function() { editingId = node.id; renderContent(node.id); });
      const saveEditsBtn = document.getElementById('saveEditsBtn');
      if (saveEditsBtn) saveEditsBtn.addEventListener('click', function() { saveEditableChanges(node.id); });
      const cancelEditsBtn = document.getElementById('cancelEditsBtn');
      if (cancelEditsBtn) cancelEditsBtn.addEventListener('click', function() { editingId = null; renderContent(node.id); });
      
      const modalEditBtn = document.getElementById('openModalEditBtn');
      if (modalEditBtn) modalEditBtn.addEventListener('click', function() { openEditModal(node.id); });

      if (editingId === node.id) {
        const list = document.getElementById('editableChecklistContainer');
        if (list) enableDragAndDrop(list);
      }
    }

    // ============================================================
    // 6. РЕДАКТИРОВАНИЕ ЧЕК-ЛИСТА
    // ============================================================
    function renderEditableChecklist(node) {
      let html = `<div class="edit-checklist" id="editableChecklistContainer">`;
      const items = node.items || [];
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        html += `<div class="edit-row" data-index="${i}" draggable="true">`;
        html += `<span class="drag-handle"><i class="fas fa-grip-vertical"></i></span>`;
        html += `<input class="time-input" type="text" value="${escapeHtml(item.time)}" placeholder="Время" data-index="${i}" data-field="time" />`;
        html += `<input class="flex-text" type="text" value="${escapeHtml(item.task)}" placeholder="Задача" data-index="${i}" data-field="task" />`;
        html += `<div class="edit-actions">`;
        html += `<button class="move-up" data-index="${i}"><i class="fas fa-chevron-up"></i></button>`;
        html += `<button class="move-down" data-index="${i}"><i class="fas fa-chevron-down"></i></button>`;
        html += `</div>`;
        html += `<button class="remove-btn" data-index="${i}"><i class="fas fa-times"></i></button>`;
        html += `</div>`;
      }
      html += `</div><div class="edit-toolbar">`;
      html += `<button class="primary-btn" id="addItemBtn"><i class="fas fa-plus"></i> Добавить пункт</button>`;
      html += `</div>`;
      
      setTimeout(() => {
        const addBtn = document.getElementById('addItemBtn');
        if (addBtn) addBtn.addEventListener('click', function() { addEditableItem(node.id); });
        document.querySelectorAll('.remove-btn').forEach(btn => {
          btn.addEventListener('click', function() { removeEditableItem(node.id, parseInt(this.dataset.index)); });
        });
        document.querySelectorAll('.move-up').forEach(btn => {
          btn.addEventListener('click', function() { moveEditableItem(node.id, parseInt(this.dataset.index), -1); });
        });
        document.querySelectorAll('.move-down').forEach(btn => {
          btn.addEventListener('click', function() { moveEditableItem(node.id, parseInt(this.dataset.index), 1); });
        });
        document.querySelectorAll('.edit-row input').forEach(input => {
          input.addEventListener('input', function() {
            const idx = parseInt(this.dataset.index);
            const field = this.dataset.field;
            const n = findNode(data.sections, node.id);
            if (n && n.items && n.items[idx]) {
              n.items[idx][field] = this.value;
              saveData();
            }
          });
        });
      }, 0);
      return html;
    }

    function addEditableItem(id) {
      const node = findNode(data.sections, id);
      if (node) { node.items.push({ time: '', task: 'Новая задача', checked: false }); saveData(); renderContent(id); }
    }
    function removeEditableItem(id, index) {
      const node = findNode(data.sections, id);
      if (node && node.items) { node.items.splice(index, 1); saveData(); renderContent(id); }
    }
    function moveEditableItem(id, index, direction) {
      const node = findNode(data.sections, id);
      if (node && node.items) {
        const newIndex = index + direction;
        if (newIndex >= 0 && newIndex < node.items.length) {
          const temp = node.items[index]; node.items[index] = node.items[newIndex]; node.items[newIndex] = temp;
          saveData(); renderContent(id);
        }
      }
    }
    function saveEditableChanges(id) {
      const node = findNode(data.sections, id);
      if (!node) return;
      const container = document.getElementById('editableChecklistContainer');
      if (!container) return;
      const newItems = [];
      container.querySelectorAll('.edit-row').forEach(row => {
        const timeInput = row.querySelector('.time-input');
        const taskInput = row.querySelector('.flex-text');
        if (taskInput && taskInput.value.trim()) {
          newItems.push({ time: timeInput ? timeInput.value.trim() : '', task: taskInput.value.trim(), checked: false });
        }
      });
      node.items = newItems; saveData(); editingId = null; renderContent(id);
    }

    // ============================================================
    // 7. ПЛАВНЫЙ DRAG AND DROP
    // ============================================================
    function enableDragAndDrop(list) {
        let draggedItem = null;
        list.querySelectorAll('.edit-row').forEach(row => {
            row.addEventListener('dragstart', function(e) {
                draggedItem = this;
                e.dataTransfer.effectAllowed = 'move';
                requestAnimationFrame(() => this.classList.add('dragging'));
            });
            row.addEventListener('dragend', function(e) {
                this.classList.remove('dragging');
                draggedItem = null;
            });
            row.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                if (!draggedItem || draggedItem === this) return;
                const rect = this.getBoundingClientRect();
                const midpoint = rect.top + rect.height / 2;
                const isBelowMidpoint = e.clientY > midpoint;
                const container = this.parentElement;
                if (isBelowMidpoint) {
                    const next = this.nextElementSibling;
                    if (next !== draggedItem) container.insertBefore(draggedItem, next);
                } else {
                    if (this !== draggedItem) container.insertBefore(draggedItem, this);
                }
            });
            row.addEventListener('drop', function(e) {
                e.preventDefault();
                if (!draggedItem) return;
                const container = draggedItem.parentElement;
                const newOrder = [];
                container.querySelectorAll('.edit-row').forEach(row => {
                    const idx = parseInt(row.dataset.index);
                    const node = findNode(data.sections, editingId);
                    if (node && node.items && node.items[idx]) newOrder.push(node.items[idx]);
                });
                const node = findNode(data.sections, editingId);
                if (node && newOrder.length > 0) {
                    node.items = newOrder;
                    saveData();
                }
                const allRows = container.querySelectorAll('.edit-row');
                allRows.forEach((row, idx) => {
                    row.dataset.index = idx;
                    row.querySelectorAll('.move-up, .move-down, .remove-btn, .time-input, .flex-text').forEach(el => {
                        if (el) el.dataset.index = idx;
                    });
                });
            });
        });
    }

    // ============================================================
    // 8. ФУНКЦИИ ЭКСПОРТА / ИМПОРТА (ТОЛЬКО ДЛЯ АДМИНА)
    // ============================================================
    function exportData() {
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'hotel-data.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    function importData() {
      document.getElementById('importFileInput').click();
    }

    function handleImportFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const imported = JSON.parse(ev.target.result);
          if (!imported.sections || !Array.isArray(imported.sections)) throw new Error('Неверный формат данных');
          data = imported;
          saveData();
          renderTree();
          if (data.sections.length > 0) selectedId = data.sections[0].id;
          else selectedId = null;
          renderContent(selectedId);
          alert('Данные успешно импортированы!');
        } catch (err) {
          alert('Ошибка импорта: ' + err.message);
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function resetData() {
      if (confirm('Сбросить все данные к начальным? Это действие необратимо!')) {
        localStorage.removeItem('hotelChecklistData');
        data = deepClone(INITIAL_DATA);
        saveData();
        selectedId = data.sections[0]?.id || null;
        expanded.clear();
        renderTree();
        renderContent(selectedId);
        alert('Данные сброшены');
      }
    }

    // ============================================================
    // 9. РЕДАКТОР QUIL (С АВТОМАТИЧЕСКИМ СЖАТИЕМ КАРТИНОК)
    // ============================================================
    let quillEditor = null;

    // Функция сжатия изображений через Canvas
    function compressImage(file, maxW = 800, maxH = 800, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > maxW) { height *= maxW / width; width = maxW; }
                    } else {
                        if (height > maxH) { width *= maxH / height; height = maxH; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });
    }

    function openEditModal(id) {
      if (!isAdmin) { alert('Доступ запрещён.'); return; }
      const node = findNode(data.sections, id);
      const isNew = id === 'new';

      document.getElementById('modalTitle').textContent = isNew ? 'Создать новый раздел' : 'Редактировать раздел';
      document.getElementById('editTitle').value = node ? node.title : '';
      document.getElementById('editType').value = node ? node.type : 'text';
      document.getElementById('modalOverlay').dataset.editId = id;
      
      const overlay = document.getElementById('modalOverlay');
      const modalEl = overlay.querySelector('.modal');
      const editorField = document.getElementById('editor-field');
      const container = document.getElementById('editor-container');

      if (quillEditor) { quillEditor = null; }
      container.innerHTML = ''; 
      const toolbarContainer = container.parentElement.querySelector('.ql-toolbar');
      if (toolbarContainer) { toolbarContainer.remove(); }

      overlay.onclick = null;
      overlay.addEventListener('click', function(e) { if (e.target === this) closeModal(); });
      modalEl.onmousedown = null;
      modalEl.addEventListener('mousedown', function(e) { e.stopPropagation(); });

      document.getElementById('editType').onchange = function() {
        const t = this.value;
        if (t === 'text') {
          editorField.style.display = 'block';
          setTimeout(() => initQuill(), 150);
        } else {
          editorField.style.display = 'none';
        }
      };

      const type = document.getElementById('editType').value;
      if (type === 'text') {
        editorField.style.display = 'block';
        setTimeout(() => initQuill(), 150);
      } else {
        editorField.style.display = 'none';
      }

      overlay.classList.add('active');

      document.getElementById('modalClose').onclick = closeModal;
      document.getElementById('modalCancel').onclick = closeModal;
      document.getElementById('modalSave').onclick = function() { saveModalEdit(document.getElementById('modalOverlay').dataset.editId); };
    }
    
    function initQuill() {
       const container = document.getElementById('editor-container');
       if (!container) return;
       
       container.innerHTML = ''; 
       const toolbarContainer = container.parentElement.querySelector('.ql-toolbar');
       if (toolbarContainer) {
           toolbarContainer.remove();
       }
       
       try {
           var Font = Quill.import('attributors/class/font');
           Font.whitelist = ['inter', 'arial', 'georgia', 'times-new-roman'];
           Quill.register(Font, true);

           const toolbarConfig = [
               [{ 'font': ['inter', 'arial', 'georgia', 'times-new-roman'] }],
               [{ 'size': ['small', false, 'large', 'huge'] }],
               [{ 'color': [] }, { 'background': [] }],
               [{ header: [1, 2, 3, false] }],
               ['bold', 'italic', 'underline', 'strike'],
               [{ list: 'ordered'}, { list: 'bullet' }],
               ['link', 'image'],
               ['clean']
           ];

           quillEditor = new Quill(container, {
               modules: { toolbar: toolbarConfig },
               theme: 'snow'
           });

           // ======================================================================
           // Обработчик картинок с автоматическим сжатием через Canvas
           // ======================================================================
           quillEditor.getModule('toolbar').addHandler('image', function() {
               const input = document.createElement('input');
               input.setAttribute('type', 'file');
               input.setAttribute('accept', 'image/*');
               input.click();

               input.onchange = async function() {
                   const file = input.files[0];
                   if (!file) return;

                   const range = quillEditor.getSelection(true);
                   quillEditor.insertText(range.index, '⏳ Загрузка и сжатие...');

                   try {
                       // Сжимаем картинку до 800px и качества 70% (формат JPEG)
                       const compressedDataUrl = await compressImage(file, 800, 800, 0.7);
                       quillEditor.deleteText(range.index, '⏳ Загрузка и сжатие...'.length);
                       quillEditor.insertEmbed(range.index, 'image', compressedDataUrl);
                   } catch (error) {
                       console.error("Ошибка загрузки картинки:", error);
                       quillEditor.deleteText(range.index, '⏳ Загрузка и сжатие...'.length);
                       quillEditor.insertText(range.index, '❌ Ошибка загрузки изображения.');
                   }
               };
           });
           // ======================================================================

           const node = findNode(data.sections, document.getElementById('modalOverlay').dataset.editId);
           if (node && node.content) {
               quillEditor.clipboard.dangerouslyPasteHTML(node.content);
           } else {
               quillEditor.setText('Введите ваши инструкции, вставьте изображения...');
           }
       } catch (e) {
           console.error("Ошибка создания Quill:", e);
           container.innerHTML = `<p style="color:#e74c3c;padding:20px;">Не удалось загрузить визуальный редактор. Проверьте подключение к интернету.</p>`;
       }
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      if (quillEditor) { quillEditor = null; }
    }

    function saveModalEdit(id) {
      if (!isAdmin) return;
      const title = document.getElementById('editTitle').value.trim();
      if (!title) { alert('Введите название раздела.'); return; }
      const type = document.getElementById('editType').value;
      let contentToSave = '';
      if (type === 'text') { contentToSave = quillEditor ? quillEditor.root.innerHTML : ''; }

      if (id === 'new') {
        const newNode = { id: generateId(), title: title, type: type };
        if (type === 'text') newNode.content = contentToSave;
        else if (type === 'checklist') newNode.items = [{ time: '09:00', task: 'Пример задачи', checked: false }];
        let parent = null;
        if (selectedId) {
          const sel = findNode(data.sections, selectedId);
          if (sel && sel.children !== undefined) parent = sel;
        }
        if (parent) {
          parent.children = parent.children || [];
          parent.children.push(newNode);
        } else {
          data.sections.push(newNode);
        }
        saveData(); renderTree(); selectNode(newNode.id);
        closeModal(); return;
      }

      const node = findNode(data.sections, id);
      if (node) {
        node.title = title;
        if (node.type !== type) {
          delete node.items; delete node.content;
          node.type = type;
          if (type === 'text') node.content = contentToSave;
          else if (type === 'checklist') node.items = [{ time: '09:00', task: 'Пример задачи', checked: false }];
        } else if (type === 'text') {
          node.content = contentToSave;
        }
        saveData(); renderTree(); renderContent(node.id);
      }
      closeModal();
    }

    // ============================================================
    // 10. УДАЛЕНИЕ РАЗДЕЛА
    // ============================================================
    function deleteSection(id) {
      if (!isAdmin) return;
      const parent = getParent(data.sections, id);
      if (parent) parent.children = parent.children.filter(c => c.id !== id);
      else data.sections = data.sections.filter(s => s.id !== id);
      if (selectedId === id) selectedId = data.sections.length > 0 ? data.sections[0].id : null;
      saveData(); renderTree();
      if (selectedId) renderContent(selectedId); else document.getElementById('contentPanel').innerHTML = '';
    }

    // ============================================================
    // 11. ГЛАВНАЯ ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    async function initData() {
      console.log('📦 Запуск initData...');
      
      let local = loadFromLocalStorage();
      if (local && local.sections && local.sections.length > 0) {
        data = local;
        console.log('✅ Загружены локальные данные');
      } else {
        console.log('⚠️ Локальных данных нет, инициализация начальных');
        data = deepClone(INITIAL_DATA);
        saveToLocalStorage(data);
      }

      const pulled = await pullFromFirebase();
      if (pulled) console.log('✅ Данные обновлены из Firebase');

      if (!data || !data.sections || data.sections.length === 0) {
        console.warn('🚨 АВАРИЙНОЕ ВОССТАНОВЛЕНИЕ ДАННЫХ!');
        data = deepClone(INITIAL_DATA);
        saveToLocalStorage(data);
      }

      if (data.sections.length > 0) {
        selectedId = data.sections[0].id;
      } else {
        selectedId = null;
      }

      renderTree();
      renderContent(selectedId);
      console.log('🎨 Рендеринг завершен.');
    }

    // ============================================================
    // 12. ЗАПУСК ПРИЛОЖЕНИЯ
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      const savedTheme = localStorage.getItem('hotelChecklistTheme') || 'default';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === savedTheme);
        btn.addEventListener('click', function() {
          document.documentElement.setAttribute('data-theme', this.dataset.theme);
          localStorage.setItem('hotelChecklistTheme', this.dataset.theme);
          document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
        });
      });

      document.getElementById('searchInput').addEventListener('input', function() {
        searchQuery = this.value; document.getElementById('searchClear').classList.toggle('visible', searchQuery.length > 0); renderTree();
      });
      document.getElementById('searchClear').addEventListener('click', function() {
        document.getElementById('searchInput').value = ''; searchQuery = ''; this.classList.remove('visible'); renderTree();
      });

      document.getElementById('adminToggle').addEventListener('click', function() {
        if (isAdmin) { isAdmin = false; }
        else { const pass = prompt('Пароль администратора:'); if (pass === ADMIN_PASSWORD) isAdmin = true; else if (pass !== null) alert('Неверный пароль.'); }
        
        // Обновляем UI Админа
        document.getElementById('statusBadge').className = isAdmin ? 'status-badge admin' : 'status-badge viewer';
        document.getElementById('statusBadge').textContent = isAdmin ? 'Админ' : 'Просмотр';
        this.textContent = isAdmin ? 'Выйти' : 'Вход';
        this.classList.toggle('admin-btn', isAdmin);
        document.getElementById('addSectionBtn').classList.toggle('hidden', !isAdmin);
        
        // Показываем/скрываем кнопки экспорта/импорта
        document.getElementById('adminDataActions').classList.toggle('visible', isAdmin);
        
        renderTree(); renderContent(selectedId);
      });

      // ===== ОБРАБОТЧИКИ ЭКСПОРТА И ИМПОРТА =====
      document.getElementById('exportDataBtn').addEventListener('click', exportData);
      document.getElementById('importDataBtn').addEventListener('click', importData);
      document.getElementById('resetDataBtn').addEventListener('click', resetData);
      document.getElementById('importFileInput').addEventListener('change', handleImportFile);

      document.getElementById('expandAllBtn').addEventListener('click', () => {
        function rec(nodes) { for (const n of nodes) { if (n.children) { expanded.set(n.id, true); rec(n.children); } } }
        rec(data.sections); renderTree();
      });
      document.getElementById('collapseAllBtn').addEventListener('click', () => {
        function rec(nodes) { for (const n of nodes) { if (n.children) { expanded.set(n.id, false); rec(n.children); } } }
        rec(data.sections); renderTree();
      });

      const addBtn = document.getElementById('addSectionBtn');
      if (addBtn) {
        addBtn.addEventListener('click', function() {
          if (!isAdmin) return alert('Нет прав администратора.');
          openEditModal('new');
        });
      }

      initData();
    });
  </script>
</body>
